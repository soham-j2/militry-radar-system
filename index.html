<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Military Radar System — Dashboard</title>
  <style>
    :root {
      --bg: #070d0a;
      --panel: #0d1712;
      --border: #1b3a29;
      --green: #00ff66;
      --green-dim: #0a5c2b;
      --red: #ff3b3b;
      --amber: #ffb020;
      --text: #d6f5e3;
      --muted: #6b967d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }

    h1 {
      font-size: 1.25rem;
      letter-spacing: 2px;
      color: var(--green);
      text-transform: uppercase;
    }

    .conn-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="text"] {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      width: 170px;
      font-family: monospace;
    }

    button {
      background: #12261c;
      color: var(--green);
      border: 1px solid var(--green-dim);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.15s;
    }

    button:hover { background: #193828; border-color: var(--green); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.danger { color: var(--red); border-color: #5c1a1a; background: #220e0e; }
    button.danger:hover { border-color: var(--red); background: #331313; }
    button.active-btn { background: var(--green); color: #041209; }

    .grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    .card h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .radar-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100%;
      max-width: 560px;
      height: auto;
      display: block;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      background: #08100c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .stat .label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; }
    .stat .val { font-size: 1.2rem; font-weight: 700; margin-top: 4px; color: var(--green); }
    .stat .val.alert { color: var(--red); }
    .stat .val.warn { color: var(--amber); }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .ir-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .ir-pill {
      flex: 1;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #08100c;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .ir-pill.hit {
      border-color: var(--amber);
      color: var(--amber);
      background: #241906;
      font-weight: 700;
    }

    .log {
      background: #050a07;
      border: 1px solid var(--border);
      border-radius: 6px;
      height: 150px;
      overflow-y: auto;
      padding: 10px;
      font-family: monospace;
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .log div { border-bottom: 1px solid #0e1d15; padding: 2px 0; }
    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.online { color: var(--green); border-color: var(--green); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Military Radar System</h1>
    </div>
    <div class="conn-bar">
      <span id="connBadge" class="badge">DISCONNECTED</span>
      <input id="ipInput" type="text" value="192.168.1.50" placeholder="ESP32 IP (e.g. 192.168.1.50)" />
      <button id="connectBtn" onclick="toggleConnect()">Connect</button>
      <button id="demoBtn" onclick="toggleDemo()">Demo Mode</button>
    </div>
  </header>

  <main class="grid">
    <section class="card">
      <h2>180° Ultrasonic Radar Sweep</h2>
      <div class="radar-wrap">
        <canvas id="radar" width="560" height="320"></canvas>
      </div>
    </section>

    <section class="card">
      <h2>Telemetry &amp; Controls</h2>
      <div class="stats">
        <div class="stat"><div class="label">System</div><div id="stStatus" class="val">STANDBY</div></div>
        <div class="stat"><div class="label">Mode</div><div id="stMode" class="val">SCANNING</div></div>
        <div class="stat"><div class="label">Angle</div><div id="stAngle" class="val">0°</div></div>
        <div class="stat"><div class="label">Distance</div><div id="stDist" class="val">-- cm</div></div>
      </div>

      <div class="ir-row">
        <div id="irLeft" class="ir-pill">IR LEFT: CLEAR</div>
        <div id="irRight" class="ir-pill">IR RIGHT: CLEAR</div>
      </div>

      <div class="controls">
        <button onclick="sendCmd('POWER_ON')">Power ON</button>
        <button class="danger" onclick="sendCmd('POWER_OFF')">Power OFF</button>
        <button onclick="sendCmd('LOCK')">Lock Target</button>
        <button onclick="sendCmd('UNLOCK')">Unlock</button>
        <button onclick="sendCmd('BUZZER_ON')">Buzzer ON</button>
        <button class="danger" onclick="sendCmd('BUZZER_OFF')">Buzzer OFF</button>
      </div>

      <h2>Event Log</h2>
      <div id="logBox" class="log"></div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('radar');
    const ctx = canvas.getContext('2d');
    const MAX_RANGE_CM = 40;

    let ws = null;
    let demoTimer = null;
    let demoAngle = 0;
    let demoDir = 1;
    let currentAngle = 0;
    let blips = []; // { angle, dist, time }

    function addLog(msg) {
      const box = document.getElementById('logBox');
      const line = document.createElement('div');
      const t = new Date().toLocaleTimeString();
      line.textContent = `[${t}] ${msg}`;
      box.prepend(line);
      if (box.children.length > 40) box.removeChild(box.lastChild);
    }

    function toggleConnect() {
      if (ws) {
        ws.close();
        return;
      }
      if (demoTimer) toggleDemo();

      const ip = document.getElementById('ipInput').value.trim();
      if (!ip) return alert('Enter the ESP32 IP address');

      const url = `ws://${ip}:81`;
      addLog(`Connecting to ${url}...`);
      ws = new WebSocket(url);

      ws.onopen = () => {
        document.getElementById('connBadge').textContent = 'CONNECTED';
        document.getElementById('connBadge').classList.add('online');
        document.getElementById('connectBtn').textContent = 'Disconnect';
        addLog('WebSocket connected');
      };

      ws.onclose = () => {
        ws = null;
        document.getElementById('connBadge').textContent = 'DISCONNECTED';
        document.getElementById('connBadge').classList.remove('online');
        document.getElementById('connectBtn').textContent = 'Connect';
        addLog('WebSocket disconnected');
      };

      ws.onerror = () => addLog('Connection error (check IP or Wi-Fi)');

      ws.onmessage = (e) => {
        try {
          handleTelemetry(JSON.parse(e.data));
        } catch {
          addLog(`Raw: ${e.data}`);
        }
      };
    }

    function sendCmd(cmd) {
      if (demoTimer) {
        addLog(`Demo Cmd: ${cmd}`);
        if (cmd === 'POWER_ON') handleTelemetry({ status: 'ACTIVE', mode: 'SCANNING' });
        if (cmd === 'POWER_OFF') handleTelemetry({ status: 'STANDBY', mode: 'STANDBY' });
        if (cmd === 'LOCK') handleTelemetry({ mode: 'TRACKING', alert: 'TARGET_LOCKED' });
        if (cmd === 'UNLOCK') handleTelemetry({ mode: 'SCANNING', alert: 'UNLOCKED' });
        return;
      }
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        return addLog('Not connected to ESP32');
      }
      ws.send(JSON.stringify({ cmd }));
      addLog(`Sent: ${cmd}`);
    }

    function handleTelemetry(data) {
      if (data.status !== undefined) {
        document.getElementById('stStatus').textContent = data.status;
      }
      if (data.mode !== undefined) {
        const el = document.getElementById('stMode');
        el.textContent = data.mode;
        el.className = 'val' + (data.mode === 'TRACKING' ? ' warn' : '');
      }
      if (data.angle !== undefined) {
        currentAngle = data.angle;
        document.getElementById('stAngle').textContent = `${data.angle}°`;
      }
      if (data.distance !== undefined) {
        const dEl = document.getElementById('stDist');
        if (data.distance > 0) {
          dEl.textContent = `${data.distance.toFixed(1)} cm`;
          dEl.className = 'val' + (data.distance < MAX_RANGE_CM ? ' alert' : '');
          if (data.distance <= MAX_RANGE_CM) {
            blips.push({ angle: currentAngle, dist: data.distance, time: Date.now() });
          }
        } else {
          dEl.textContent = 'CLEAR';
          dEl.className = 'val';
        }
      }
      if (data.ir_left !== undefined) {
        const el = document.getElementById('irLeft');
        el.textContent = `IR LEFT: ${data.ir_left ? 'DETECTED' : 'CLEAR'}`;
        el.className = 'ir-pill' + (data.ir_left ? ' hit' : '');
      }
      if (data.ir_right !== undefined) {
        const el = document.getElementById('irRight');
        el.textContent = `IR RIGHT: ${data.ir_right ? 'DETECTED' : 'CLEAR'}`;
        el.className = 'ir-pill' + (data.ir_right ? ' hit' : '');
      }
      if (data.alert !== undefined) {
        addLog(`ALERT: ${data.alert}`);
      }
    }

    function toggleDemo() {
      const btn = document.getElementById('demoBtn');
      if (demoTimer) {
        clearInterval(demoTimer);
        demoTimer = null;
        btn.classList.remove('active-btn');
        btn.textContent = 'Demo Mode';
        addLog('Demo mode stopped');
        return;
      }
      if (ws) ws.close();
      btn.classList.add('active-btn');
      btn.textContent = 'Stop Demo';
      handleTelemetry({ status: 'ACTIVE', mode: 'SCANNING' });
      addLog('Demo mode started');

      demoTimer = setInterval(() => {
        demoAngle += demoDir * 2;
        if (demoAngle >= 180) demoDir = -1;
        if (demoAngle <= 0) demoDir = 1;
        const fakeHit = (demoAngle > 68 && demoAngle < 84) ? 22 + Math.random() * 3 : -1;
        handleTelemetry({ angle: demoAngle, distance: fakeHit });
      }, 45);
    }

    function drawRadar() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h - 24;
      const r = Math.min(w / 2 - 24, h - 44);

      ctx.fillStyle = '#050b08';
      ctx.fillRect(0, 0, w, h);

      // Range rings
      ctx.strokeStyle = '#143824';
      ctx.lineWidth = 1;
      for (let i = 1; i <= 4; i++) {
        ctx.beginPath();
        ctx.arc(cx, cy, (r * i) / 4, Math.PI, 0);
        ctx.stroke();
        ctx.fillStyle = '#3b7555';
        ctx.font = '11px monospace';
        ctx.fillText(`${i * 10}cm`, cx + 4, cy - (r * i) / 4 + 12);
      }

      // Angle spokes
      for (let a = 0; a <= 180; a += 30) {
        const rad = (a * Math.PI) / 180;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx - Math.cos(rad) * r, cy - Math.sin(rad) * r);
        ctx.stroke();
      }

      // Sweep line
      const sweepRad = (currentAngle * Math.PI) / 180;
      ctx.strokeStyle = '#00ff66';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx - Math.cos(sweepRad) * r, cy - Math.sin(sweepRad) * r);
      ctx.stroke();

      // Blips (fade out over 2.5s)
      const now = Date.now();
      blips = blips.filter(b => now - b.time < 2500);
      for (const b of blips) {
        const alpha = 1 - (now - b.time) / 2500;
        const rad = (b.angle * Math.PI) / 180;
        const distPx = (Math.min(b.dist, MAX_RANGE_CM) / MAX_RANGE_CM) * r;
        const bx = cx - Math.cos(rad) * distPx;
        const by = cy - Math.sin(rad) * distPx;

        ctx.fillStyle = `rgba(255, 59, 59, ${alpha})`;
        ctx.beginPath();
        ctx.arc(bx, by, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(drawRadar);
    }

    drawRadar();
  </script>
</body>
</html>
